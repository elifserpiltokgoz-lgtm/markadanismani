<script>
(()=>{
const TK="km_tok",$=i=>document.getElementById(i),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let mode="login",cfg=null;
const msg=(t,k)=>{const m=$("gm");m.className="gm "+(t?k:"");m.textContent=t||""};
const AUTH_ENABLED=false; // TEST: login'i geri açmak için true yapın
const show=(note,k)=>{if(!AUTH_ENABLED)return;$("gate").style.display="flex";if(note)msg(note,k||"w");loadCfg()};
const hide=()=>{$("gate").style.display="none"};
async function loadCfg(){if(cfg)return;try{cfg=await(await fetch("/auth/config")).json()}catch(e){cfg={}}
if(cfg.title||cfg.price||cfg.contact)$("gi").innerHTML='<div class="gi"><b>'+esc(cfg.title||"Üyelik")+'</b>'+(cfg.price?'<div>'+esc(cfg.price)+'</div>':'')+(cfg.contact?'<div>📞 '+esc(cfg.contact)+'</div>':'')+'</div>'}
function setMode(m){mode=m;$("gt1").className=m=="login"?"on":"";$("gt2").className=m=="reg"?"on":"";$("gn").hidden=m!="reg";$("gg").textContent=m=="reg"?"Başvur":"Giriş yap";$("gp").autocomplete=m=="reg"?"new-password":"current-password";msg("")}
$("gt1").onclick=()=>setMode("login");$("gt2").onclick=()=>setMode("reg");
const tok=()=>localStorage.getItem(TK)||"";
const logout=()=>{localStorage.removeItem(TK);const o=$("out");if(o)o.remove();setMode("login");$("gf").hidden=false;$("gx").hidden=true;show("")};
$("gx").onclick=logout;
function status(me){ // me: {status,plan,exp,name}
 if(me.status=="active"&&(!me.exp||me.exp>Date.now())){hide();addOut(me);return true}
 $("gf").hidden=true;$("gx").hidden=false;show(me.status=="blocked"?"Üyeliğiniz durdurulmuş. Lütfen yöneticiyle iletişime geçin.":me.status=="active"?"Üyelik süreniz dolmuş. Yenilemek için yöneticiyle iletişime geçin.":"Başvurunuz alındı ve onay bekliyor. Onaylandığında bu sayfayı yenileyip giriş yapabilirsiniz.","w");return false}
function addOut(me){if($("out"))return;const b=document.createElement("button");b.className="btn";b.id="out";b.textContent="👤 Çıkış";const d=me.exp?Math.max(0,Math.ceil((me.exp-Date.now())/864e5)):null;b.title=(me.name||"")+" · "+(me.plan||"")+(d!=null?" · "+d+" gün kaldı":"");b.onclick=logout;const ex=$("ex");ex&&ex.parentNode.insertBefore(b,ex)}
$("gg").onclick=async()=>{const e=$("ge").value.trim(),p=$("gp").value,n=$("gn").value.trim();msg("");
 if(!e||!p||(mode=="reg"&&!n)){msg("Tüm alanları doldurun.","e");return}
 $("gg").disabled=true;
 try{const r=await fetch(mode=="reg"?"/auth/register":"/auth/login",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({email:e,password:p,name:n})});const j=await r.json().catch(()=>({}));
  if(mode=="reg"){if(r.ok){setMode("login");msg("Başvurunuz alındı! Yönetici onayladığında giriş yapabilirsiniz.","o")}else msg(j.err=="exists"?"Bu e-posta ile zaten başvuru var. Giriş yapın.":j.err=="invalid"?"Geçerli e-posta, ad ve en az 6 karakterli şifre girin.":"Şu an işlem yapılamıyor, sonra tekrar deneyin.","e")}
  else{if(r.ok){localStorage.setItem(TK,j.token);status(j)}else msg(r.status==401?"E-posta veya şifre hatalı.":"Şu an işlem yapılamıyor, sonra tekrar deneyin.","e")}
 }catch(x){msg("Bağlantı hatası. İnternetinizi kontrol edin.","e")}
 $("gg").disabled=false};
async function init(){if(!AUTH_ENABLED){hide();return}if(!tok()){show("");return}
 try{const r=await fetch("/api/me",{headers:{authorization:"Bearer "+tok()}});if(r.ok)status(await r.json());else{localStorage.removeItem(TK);show("")}}catch(e){show("Bağlantı hatası.","e")}}
async function call(m){const r=await fetch("/api",{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+tok()},body:JSON.stringify({messages:m})});
 if(r.ok)return(await r.json()).text;
 const j=await r.json().catch(()=>({}));
 if(r.status==401){localStorage.removeItem(TK);show("Oturumunuz sona erdi, lütfen tekrar giriş yapın.");throw{code:"auth"}}
 if(r.status==403||r.status==402){status({status:r.status==402?"active":j.err,exp:1});throw{code:"auth"}}
 if(r.status==429)throw{code:j.err=="quota"?"quota":"rate_limited"};
 throw{code:"error"}}
window.claude={use:async n=>{
 if(n=="sample"){const f=async m=>({text:await call(typeof m=="string"?[{role:"user",content:m}]:m)});f.json=async p=>{const t=await call([{role:"user",content:p}]);const x=t.replace(/```json|```/g,"").trim();const a=x.indexOf("{"),b=x.lastIndexOf("}");if(a<0||b<a)throw{code:"error"};return JSON.parse(x.slice(a,b+1))};return f}
 if(n=="downloads")return{save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:/\.html$/.test(filename)?"text/html":/\.svg$/.test(filename)?"image/svg+xml":"text/markdown"}));a.download=filename;a.click()}}}};
window.addEventListener("load",init);
})();
</script>
<script>

const TABS=[["brief","🏠 Başla"],["brand","🎨 Marka"],["cmp","🔎 Rakip"],["deck","🎬 Sunum"],["plan","✅ Plan"],["mk","✍️ İçerik"],["hk","🪝 Kanca"],["req","🧰 Talep"],["chat","💬 Konsey"]];

const ROLE=`Sen "Pazarlama Müdürüm Cebimde" uygulamasının yapay zekâsısın: 25 yıllık deneyimli, dünya standartlarında bir Pazarlama Müdürü (CMO) ve Danışman Konseyi (Strateji, Marka, Performans, Finans, Tüketici Psikolojisi, Pazar Araştırması). Kotler, Byron Sharp, Ries&Trout, Cialdini, Mavi Okyanus, JTBD, AARRR, Ansoff, STP/4P ve Cannes/Effie vakalarını bilirsin; Türkiye pazarını (Instagram, TikTok, Trendyol, sezon takvimi) iyi tanırsın. Türkçe yaz. Somut, özgün, uygulanabilir ol; sayı uydurma, tahmin ise "tahmini" de. Dil sade olsun: yönetim kurulu üyesi de anlasın. Her zaman kısa, öz ve etkili yaz; dolgu cümle, giriş ve tekrar kullanma.`;
const fillPct=()=>Math.round(FIELDS.filter(f=>S.brief[f[0]]).length/FIELDS.length*100);const qc=(k,a)=>a.map(v=>`<button class="qc ${S.brief[k]==v?"on":""}" data-q="${k}|${v}">${v}</button>`).join("");const EX={name:"Ada Kahve",sector:"Butik kahve dükkânı (filtre kahve, tatlı)",aud:"25-40 yaş şehirli çalışanlar ve öğrenciler",budget:"10.000 TL",goal:"Mahalle dışından 300 yeni müşteri",extra:"Yakında 2 zincir rakip var; Instagram'da 800 takipçi"};const ctx=()=>"MARKA BRIEF'İ:\n"+FIELDS.map(f=>f[1]+": "+(S.brief[f[0]]||"belirtilmedi")).join("\n")+"\nNotlar/rakipler/mevcut durum: "+(S.brief.extra||"belirtilmedi")+(S.brand?"\nMarka kimliği: öz="+S.brand.essence+"; slogan="+S.brand.tagline+"; kişilik="+(S.brand.personality||[]).join(", ")+"; ses tonu örneği="+(S.brand.voice&&S.brand.voice.sample)+"; büyük fikir="+(S.brand.bigIdea&&S.brand.bigIdea.idea)+". Bu kimliğe sadık kal.":"")+(S.brief.comp?"\nBilinen rakipler: "+S.brief.comp:"")+(S.prefs.length?"\nKullanıcının geri bildirimleri (mutlaka dikkate al): "+S.prefs.join(" | "):"")+(((S.assets.docs||[]).map(d=>d.text).join("\n")+(S.brief.sample||"")).trim()?"\nMarka dokümanlarından/örnek içerikten ses tonunu ve bilgiyi öğren: "+((S.assets.docs||[]).map(d=>d.text).join("\n")+"\n"+(S.brief.sample||"")).slice(0,3500):"")+((S.assets.products||[]).length?"\nÜrün dosyaları: "+S.assets.products.map(x=>x.name).join(", "):"");
const SCH={
hk:`Viral kanca atölyesi: bu marka için 12 kanca üret; her biri farklı formül olsun (Merak boşluğu, Karşıt görüş, Hikâye başlangıcı, Sayı/Liste, Soru, Hata itirafı, Sosyal kanıt, Aciliyet, Mit çürütme, Önce/Sonra, Sır paylaşımı, Meydan okuma). hook: ilk 3 saniyede söylenecek veya yazılacak cümle, en fazla 10 kelime. visual: ilk karenin görsel fikri, en fazla 10 kelime. why: neden işe yarar, en fazla 8 kelime. Ayrıca 10 hashtag (geniş, niş ve yerel karışık) ve 3 yayın saati denemesi öner (tahmini). SADECE JSON döndür: {"hooks":[{"formula":"","hook":"","visual":"","why":""}],"hashtags":["#"],"times":["Salı 19:00"]}`,
cmp:`Detaylı bir rakip benchmark analizi yap. Brief'teki sektöre göre 4 rakip değerlendir (kullanıcı rakip verdiyse önce onları kullan; vermediyse sektörün bilinen oyuncularını veya gerçekçi rakip tiplerini seç). Bilmediğin fiyat veya sayıyı uydurma, 'doğrulanmalı' yaz; skorlar 1-10 arası TAHMİNİ olsun. 'you' skorları markanın ulaşabileceği hedef konumdur. Her metin en fazla 10 kelime. SADECE JSON döndür: {"market":"pazar özeti, en fazla 30 kelime","competitors":[{"name":"","type":"doğrudan|dolaylı","positioning":"","strengths":["2 madde"],"weaknesses":["2 madde"],"price":"","channels":["2-3 kanal"],"scores":{"marka":0,"fiyat":0,"dijital":0,"deneyim":0,"guven":0}}],"you":{"scores":{"marka":0,"fiyat":0,"dijital":0,"deneyim":0,"guven":0}},"gaps":["3 fırsat boşluğu"],"swot":{"s":["2"],"w":["2"],"o":["2"],"t":["2"]},"moves":["5 somut hamle, en fazla 12 kelime"]}`,
brand:`Marka Danışmanı ve Yaratıcı Direktör olarak bu markaya özgü, cesur ve ayırt edici bir marka kiti üret. Klişelerden (kaliteli, güvenilir, yenilikçi) kesinlikle kaçın; sürprizli ve akılda kalıcı ol. Her metin kısa ve vurucu. 5 renk, 3 yaratıcı rota. SADECE JSON döndür: {"essence":"marka özü, 1 cümle","tagline":"slogan, en fazla 6 kelime","personality":["3 tek kelimelik kişilik özelliği"],"voice":{"do":["3 madde, en fazla 6 kelime"],"dont":["3 madde, en fazla 6 kelime"],"sample":"örnek sosyal medya cümlesi"},"palette":[{"name":"renk adı","hex":"#RRGGBB","role":"ana|vurgu|zemin|metin"}],"manifesto":"en fazla 40 kelime","story":"marka hikâyesi, en fazla 45 kelime","bigIdea":{"name":"kampanya adı","insight":"tüketici içgörüsü, en fazla 15 kelime","idea":"büyük fikir, en fazla 25 kelime"},"routes":[{"title":"rota adı","concept":"en fazla 20 kelime","hook":"ilk 3 saniyelik kanca"}],"viral":["3 viral içerik formatı, en fazla 14 kelime"],"names":["5 alternatif marka veya ürün adı"]}`,
deck:`Yönetim kuruluna sunulacak 9 slaytlık sunum hazırla. Sıra: 1 kapak (type t), 2 mevcut durum ve fırsat, 3 hedef kitle içgörüsü, 4 konumlandırma ve ana fikir, 5 strateji sütunları (teori çerçevesini sade anlat, örn. STP, Sharp), 6 90 günlük uygulama planı, 7 bütçe dağılımı ve beklenen sonuçlar (kpis dolu; bunlar tahmini hedeflerdir, her etiketin sonuna "hedef" yaz), 8 riskler ve önlemler, 9 yönetimden karar talebi. Her slaytta en fazla 3 madde, her madde en fazla 9 kelime, vurucu ve net; başlık en fazla 6 kelime; alt başlık tek kısa cümle. Her slayta uygun tek bir emoji (icon) ekle. SADECE JSON döndür: {"slides":[{"type":"t|n","icon":"","title":"","subtitle":"","bullets":[""],"kpis":[{"label":"","value":""}],"note":"konuşmacı notu, 1 cümle"}]}`,
plan:`90 günlük uygulama planı: tam 12 görev, 3 faza dağıt. Başlık en fazla 8 kelime ve fiille başlasın; sahibi tek rol; kpi kısa ve sayısal (örn. '+50 takipçi'). SADECE JSON döndür: {"tasks":[{"phase":"1. Hafta|2-4. Hafta|2-3. Ay","title":"","owner":"","kpi":"","priority":"Yüksek|Orta|Düşük"}]}`,
mk:`İlk pazarlama içerik paketini üret: 5 slogan (en fazla 6 kelime), 6 gönderi (format: Reels/Carousel/Story/Post karışık; hook en fazla 8 kelime, caption en fazla 25 kelime, cta en fazla 4 kelime), 3 reklam (başlık en fazla 6, metin en fazla 20 kelime), 1 e-posta (konu en fazla 8 kelime, gövde en fazla 60 kelime). Kısa, vurucu, markaya özel; klişelerden kaçın, sürprizli ve paylaşılabilir ol; marka kimliği varsa ses tonuna sadık kal. SADECE JSON döndür: {"slogans":[""],"posts":[{"format":"","hook":"","caption":"","cta":""}],"ads":[{"headline":"","text":""}],"email":{"subject":"","body":""}}`};
const RQ={
name:`10 özgün marka veya ürün adı öner (Türkçe ve global karışık, kısa, telaffuzu kolay, akılda kalıcı). SADECE JSON döndür: {"items":[{"name":"","why":"en fazla 12 kelime","tagline":"en fazla 5 kelime"}]}`,
logo:`3 farklı logo konsepti tasarla. Her biri sade, ölçeklenebilir ve markanın kimliğini yansıtan bir SVG olsun: viewBox 0 0 200 200, en fazla 12 şekil, marka renklerini kullan, yazıda font-family Georgia veya Arial, SVG içinde SADECE tek tırnak kullan, script ve image yok. SADECE JSON döndür: {"items":[{"name":"konsept adı","concept":"en fazla 15 kelime","svg":"<svg ...>...</svg>"}]}`,
brochure:`Tek sayfalık tanıtım broşürü içeriği yaz (3 fayda, 3 adım). Rakam UYDURMA: brief'te verilmeyen hiçbir sayı, yüzde veya iddia yazma. stat.value kısa bir vaat olsun (örn. 'Her gün taze'), stat.label kısa açıklama veya boş olsun. contact: marka adı + [telefon] · [adres] · [@instagram] yer tutucuları. SADECE JSON döndür: {"headline":"en fazla 7 kelime","sub":"en fazla 16 kelime","benefits":[{"icon":"emoji","title":"en fazla 3 kelime","text":"en fazla 14 kelime"}],"steps":["en fazla 6 kelime"],"stat":{"value":"","label":""},"cta":"en fazla 5 kelime","contact":"örnek iletişim satırı"}`,
road:`12 aylık stratejik yol haritası hazırla (4 çeyrek). SADECE JSON döndür: {"vision":"en fazla 15 kelime","northStar":"tek ana ölçüt","quarters":[{"q":"1. Çeyrek","theme":"en fazla 4 kelime","goals":["2 hedef, en fazla 8 kelime"],"moves":["3 hamle, en fazla 8 kelime"],"kpi":"kısa sayısal hedef"}],"risks":["2 risk, en fazla 8 kelime"]}`};

const BRCSS=`.br{background:#fff;color:#1b2236;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.15);font-family:Inter,Arial,sans-serif;max-width:640px;margin:0 auto}.br .bh{background:linear-gradient(135deg,var(--c1),var(--c2));color:#fff;padding:30px 26px}.br h2{font:700 clamp(26px,6vw,38px) Georgia,serif;margin:0 0 8px;line-height:1.1}.br .bh p{margin:0 0 14px;opacity:.95}.br .bt{display:inline-block;background:#fff;color:#1b2236;padding:9px 18px;border-radius:99px;font-weight:700}.br .bb{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding:22px 26px}.br .bb div{background:#f6f1e7;border-radius:14px;padding:14px}.br .bb b{display:block;margin:4px 0}.br .bb span{font-size:26px}.br .bl{height:44px;margin-bottom:10px;display:block;background:#fff;border-radius:8px;padding:4px}.br .bg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 26px 14px}.br .bg img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.br .bs{padding:0 26px 10px;display:flex;gap:10px;flex-wrap:wrap}.br .bs div{flex:1;min-width:140px;border-top:3px solid var(--c2);padding-top:6px;font-size:14px}.br .bn{margin:14px 26px;padding:14px;border-radius:14px;background:#1b2236;color:#fff;text-align:center}.br .bn b{font:700 28px Georgia,serif;color:#ffd27a;display:block}.br .bf{padding:14px 26px 22px;color:#666;font-size:13px;text-align:center}`;

if(S.err)h+=`<div class="err">${esc(S.err)}</div>`;if(S.busy&&S.busy[0]=="r")h+=wait();
if(R.name&&R.name.items)h+=`<div class="ph">Marka adı önerileri</div><div class="grid">`+R.name.items.map((i,k)=>`<div class="cd"><small>${esc(i.tagline)} ${altb("req.name.items."+k)} ${cp(i.name+" - "+i.tagline)}</small><b>${esc(i.name)}</b>\n${esc(i.why)}</div>`).join("")+`</div><div class="note">Müsaitliği doğrulayın: App Store, Türk Patent, alan adı, Instagram.</div>`+fbp("req.name");
if(R.logo&&R.logo.items)h+=`<div class="ph">Logo konseptleri</div><div class="grid w">`+R.logo.items.map((l,k)=>`<div class="cd lc"><img alt="" src="${svgUri(l.svg)}"><small>${esc(l.name)}</small>${esc(l.concept)}
<button class="cp" data-sv="${k}">SVG indir</button> ${altb("req.logo.items."+k)}</div>`).join("")+`</div>`+fbp("req.logo");
if(R.brochure){const p=pals();h+=`<div class="ph">Broşür</div><label>İLETİŞİM SATIRI (broşürde görünür)</label><input data-b="contact" value="${esc(S.brief.contact||"")}" placeholder="0555 000 00 00 · Adres · @instagram"><style>${BRCSS}</style>`+brHtml(R.brochure,...brC())+`<div class="row"><button class="btn" id="bdl">⬇ Broşürü indir (HTML; yazdırınca PDF olur)</button></div>`+fbp("req.brochure")}
if(R.road&&R.road.quarters){const r=R.road;h+=`<div class="ph">Stratejik yol haritası</div><div class="bk"><small>VİZYON</small><div class="bq">${esc(r.vision)}</div><div class="tg">⭐ ${esc(r.northStar)}</div></div><div class="grid w">`+r.quarters.map((q,k)=>`<div class="cd qd c${k}"><small>${esc(q.q)}</small><b>${esc(q.theme)}</b>
🎯 ${(q.goals||[]).map(esc).join(" · ")}
🛠 ${(q.moves||[]).map(esc).join(" · ")}
📊 ${esc(q.kpi)}</div>`).join("")+`</div>`+(r.risks&&r.risks.length?`<div class="note"><b>Riskler:</b> ${r.risks.map(esc).join(" · ")}</div>`:"")+fbp("req.road")}
return h},
hk(){const c=S.hk;let h=`<div class="hero"><h1>Akışı durduran <em>kancalar.</em></h1><p>İlk 3 saniyede izleyiciyi yakalayan cümleler, görsel fikirler ve hazır Reels senaryoları.</p></div>`+genBar("hk","Kancaları Üret");
if(S.busy=="hk")return h+wait();if(!c||!c.hooks)return h+`<div class="empty">Henüz kanca yok. Briefi doldurup "Kancaları Üret"e basın.</div>`;
h+=`<div class="ph">12 kanca</div>`+c.hooks.map((x,i)=>{const sc=x.script;return `<div class="cd"><small>${esc(x.formula)} ${altb("hk.hooks."+i)} ${cp(x.hook)}</small><b>🪝 ${esc(x.hook)}</b>\n🎥 ${esc(x.visual)}\n💡 ${esc(x.why)}${sc?`<div class="scr">${(sc.scenes||[]).map(z=>`<div>⏱ <b>${esc(z.t)}</b> ${esc(z.say)} <span class="mu">(${esc(z.show)})</span></div>`).join("")}<div>📝 ${esc(sc.caption)}</div><div>👉 ${esc(sc.cta)}</div><div>🎵 ${esc(sc.sound)}</div></div>`:""}<button class="cp sb" data-sc="${i}">${S.alt=="sc"+i?"⏳":sc?"🎬 Yeniden yaz":"🎬 Senaryo yaz"}</button></div>`}).join("");
h+=`<div class="ph">Hashtag</div><div class="cd"><small>${cp((c.hashtags||[]).join(" "))}</small>${(c.hashtags||[]).map(esc).join(" ")}</div><div class="note"><b>Yayın saati denemeleri:</b> ${(c.times||[]).map(esc).join(" · ")}. Tahminidir; kendi hesap verinizle test edin.</div>`;return h+fbp("hk")},
deck(){const d=S.deck;let h=`<h1>Yönetim Kurulu <em>Sunumu</em></h1><p class="mu">Teori ve uygulama bir arada: sade, 9 slayt, konuşmacı notlu.</p>`+genBar("deck","Sunumu Hazırla");
if(S.busy=="deck")return h+wait();if(!d||!d.slides)return h+`<div class="empty">Henüz sunum yok. Briefi doldurup “Sunumu Hazırla”ya basın.</div>`;
const n=d.slides.length,s=d.slides[Math.min(S.i,n-1)];
return h+`<div class="slide ${s.type=="t"?"ts":""} c${S.i%5}${S.fs?" fsx":""}" id="sl"><div class="sn">${S.i+1} / ${n}</div>${s.type=="t"&&S.assets.logo?`<img class="slg" src="${S.assets.logo}">`:`<div class="ic">${esc(s.icon||"✨")}</div>`}<h2>${esc(s.title)}</h2>${s.subtitle?`<p class="sub">${esc(s.subtitle)}</p>`:""}${(s.bullets||[]).length?`<ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join("")}</ul>`:""}${(s.kpis||[]).length?`<div class="kp">${s.kpis.map(k=>`<div><b>${esc(k.value)}</b><small>${esc(k.label)}</small></div>`).join("")}</div>`:""}</div>
${S.fs?'<div class="fsc"><button data-n="-1">←</button><button data-n="1">→</button><button id="fx">✕</button></div>':""}<div class="nv"><button class="btn" data-n="-1">←</button><div class="dt">${d.slides.map((_,k)=>`<i class="${k==S.i?"on":""}"></i>`).join("")}</div><button class="btn" data-n="1">→</button><button class="btn" id="fs">⛶ Tam ekran</button></div>
${s.note?`<div class="note"><b>Konuşmacı notu:</b> ${esc(s.note)}</div>`:""}${fbp("deck")}`},
plan(){const p=S.plan;let h=`<h1>Aksiyon <em>Panosu</em></h1><p class="mu">Strateji sunumdan çıkıp işe dönüşür. Yapılanları işaretleyin.</p>`+genBar("plan","Planı Üret");
if(S.busy=="plan")return h+wait();if(!p||!p.tasks)return h+`<div class="empty">Henüz plan yok.</div>`;
const dn=p.tasks.filter((t,k)=>S.done[k]).length,pc=Math.round(dn/p.tasks.length*100);
h+=`<b>%${pc} tamamlandı</b> <span class="mu">(${dn}/${p.tasks.length})</span><div class="pg"><i style="width:${pc}%"></i></div>`;let last="";
p.tasks.forEach((t,k)=>{if(t.phase!=last){h+=`<div class="ph">${esc(t.phase)}</div>`;last=t.phase}
h+=`<label class="t p${esc(t.priority)} ${S.done[k]?"d":""}"><input type="checkbox" data-d="${k}" ${S.done[k]?"checked":""}><div><div class="tt">${esc(t.title)}</div><div class="tm"><span class="bd">${esc(t.priority)}</span>👤 ${esc(t.owner)} · 🎯 ${esc(t.kpi)}</div></div></label>`});return h+fbp("plan")},
mk(){const m=S.mk;let h=`<h1>Üretim <em>Atölyesi</em></h1><p class="mu">Hemen kullanabileceğiniz sloganlar, gönderiler, reklamlar ve e-posta.</p>`+genBar("mk","İçerikleri Üret");
if(S.busy=="mk")return h+wait();if(!m)return h+`<div class="empty">Henüz içerik yok.</div>`;
h+=`<div class="ph">Slogan seçenekleri</div><div class="chips">${(m.slogans||[]).map((s,k)=>`<div class="cd">${esc(s)} ${cp(s)} ${altb("mk.slogans."+k)}</div>`).join("")}</div><div class="ph">Sosyal medya gönderileri</div>`;
(m.posts||[]).forEach((p,k)=>{const t=p.hook+"\n\n"+p.caption+"\n\n"+p.cta;h+=`<div class="cd"><small>${esc(p.format)} ${altb("mk.posts."+k)} ${cp(t)}</small><b>${esc(p.hook)}</b>\n${esc(p.caption)}\n👉 ${esc(p.cta)}</div>`});
h+=`<div class="ph">Reklam metinleri</div>`;(m.ads||[]).forEach((a,k)=>{h+=`<div class="cd"><small>REKLAM ${altb("mk.ads."+k)} ${cp(a.headline+"\n"+a.text)}</small><b>${esc(a.headline)}</b>\n${esc(a.text)}</div>`});
if(m.email)h+=`<div class="ph">Tanıtım e-postası</div><div class="cd"><small>${esc(m.email.subject)} ${cp(m.email.subject+"\n\n"+m.email.body)}</small>${esc(m.email.body)}</div>`;return h+fbp("mk")},
chat(){return `<h1>Konseye <em>danışın</em></h1><p class="mu">Briefinizi bilen danışman konseyine ek sorular sorun.</p>`+S.chat.map(m=>`<div class="ch ${m.role=="user"?"u":""}"><div>${esc(m.content)}${m.role=="user"?"":` <button class="cp" data-sa="${encodeURIComponent(m.content)}">🔊</button>`}</div></div>`).join("")+(S.busy=="chat"?wait():"")+(S.err?`<div class="err">${esc(S.err)}</div>`:"")+`<div class="row"><textarea id="cq" rows="2" placeholder="Yazın ya da konuşun…">${esc(S.cqv||"")}</textarea></div><div class="row"><button class="btn" data-mic="chat">${S.mic=="chat"?"⏹ Dinliyorum…":"🎤 Konuş"}</button><button class="btn ${S.vm?"on2":""}" id="vm">🎧 Sesli sohbet: ${S.vm?"Açık":"Kapalı"}</button><button class="btn pri" id="cs" ${S.busy?"disabled":""}>Gönder</button></div>`}};
const SEC={brief:["Başla","Bilgileri gir, paketi üret"],brand:["Marka kimliği","Slogan, renk, ses tonu, büyük fikir"],cmp:["Rakip analizi","Skor tablosu, SWOT, hamleler"],deck:["Yönetim sunumu","9 slayt, konuşmacı notlu"],plan:["Aksiyon planı","12 görev, ilerleme takibi"],mk:["İçerik paketi","Gönderi, reklam, e-posta"],hk:["Kanca atölyesi","Viral kancalar, Reels senaryoları"],req:["Talep merkezi","İsim, logo, broşür, yol haritası"],chat:["Konsey","Sorularınızı sorun"]},ORD=["brief","brand","cmp","deck","plan","mk","hk","req","chat"];
const dn=k=>k=="req"?Object.keys(S.req||{}).length:(k=="brief"||k=="chat")?0:S[k];
const tiles=(skip)=>ORD.map((k,j)=>k==skip?"":`<button class="st2 ${S.tab==k?"on":""}" data-t="${k}"><i>${TABS[j][1].split(" ")[0]}</i><b>${SEC[k][0]}</b><span>${SEC[k][1]}</span>${dn(k)?'<u>✓</u>':''}</button>`).join("");
function render(){const keep=document.activeElement&&document.activeElement.id=="cq"?$("cq").value:"";
const i=ORD.indexOf(S.tab),nx=ORD[i+1];CP=[];
$("v").innerHTML=`<div class="crumb"><b>${TABS[i][1].split(" ")[0]} ${SEC[S.tab][0]}</b><span>${i+1} / ${ORD.length}</span></div>`+V[S.tab]()+(nx?`<div class="nxt"><button class="btn" data-t="${nx}">Sıradaki: ${SEC[nx][0]} →</button></div>`:"");
$("sheet").innerHTML=S.menu?`<div class="bd2" data-m="0"></div><div class="sh"><div class="shh"><b>Nereye gidelim?</b><button class="btn" data-m="0">✕ Kapat</button></div><div class="sg">${tiles()}</div></div>`:"";
if(keep&&$("cq"))$("cq").value=keep}
async function ask(){const q=(($("cq")&&$("cq").value)||S.cqv||"").trim();S.cqv="";if(!q||S.busy)return;const sm=await claude.use("sample");if(!sm){S.err="Yapay zekâ erişimi yok.";return render()}
S.chat.push({role:"user",content:q});S.busy="chat";S.err="";render();
const h=S.chat.slice(-8);const f=ROLE+"\nEn fazla 120 kelime: 1 cümlelik net öneri, sonra en fazla 3 kısa madde (• ile), en sonda tek bir şimdi-yapılacak adım. Düz metin.\n\n"+ctx()+"\n\n";
const msgs=h.map((m,k)=>k==0?{role:m.role,content:f+m.content}:m);
try{const r=await sm(msgs,{modelTier:"complex",cache:false});{const a=(r.text||"").replace(/\*\*|^#+\s*/gm,"");S.chat.push({role:"assistant",content:a});if(S.vm)say(a)}}catch(e){S.chat.pop();S.err=em(e)}
S.busy="";save();render()}
document.addEventListener("click",e=>{const t=e.target;let a;
if(t.closest("#mn")){S.menu=!S.menu;render()}else if(t.closest("[data-m]")){S.menu=false;render()}else if(a=t.closest("[data-t]")){S.tab=a.dataset.t;S.err="";S.menu=false;S.fs=false;$("main").scrollTop=0;save();render()}
else if(a=t.closest("[data-g]"))gen(a.dataset.g);
else if(t.closest("#all"))all();
else if(a=t.closest("[data-n]")){const n=S.deck.slides.length;S.i=Math.max(0,Math.min(n-1,S.i+ +a.dataset.n));save();render()}
else if(t.closest("#fs")){S.fs=true;render()}else if(t.closest("#fx")){S.fs=false;render()}
else if(a=t.closest("[data-cp]")){const c=a.__c||0;const txt=window.__cp&&0;navigator.clipboard&&navigator.clipboard.writeText(CPT[a.dataset.cp]).then(()=>{a.textContent="Kopyalandı"}).catch(()=>{})}
else if(a=t.closest("[data-q]")){const i=a.dataset.q.indexOf("|");S.brief[a.dataset.q.slice(0,i)]=a.dataset.q.slice(i+1);save();render()}
else if(t.closest("[data-ex]")){Object.assign(S.brief,EX);save();render()}
else if(a=t.closest("[data-r]"))genReq(a.dataset.r);
else if(a=t.closest("[data-sv]"))dlSvg(+a.dataset.sv);
else if(t.closest("#bdl"))dlBr();
else if(a=t.closest("[data-mic]"))mic(a.dataset.mic);
else if(t.closest("#vm")){S.vm=!S.vm;render()}
else if(a=t.closest("[data-sa]"))say(decodeURIComponent(a.dataset.sa));
else if(a=t.closest("[data-alt]"))alt(a.dataset.alt);
else if(a=t.closest("[data-imp]"))improve(a.dataset.imp);
else if(a=t.closest("[data-sc]"))scr(+a.dataset.sc);
else if(a=t.closest("[data-rm]")){const v=a.dataset.rm;if(v=="logo")S.assets.logo=null;else if(v[0]=="p")S.assets.products.splice(+v.slice(1),1);else S.assets.docs.splice(+v.slice(1),1);save();render()}
else if(t.closest("#cs"))ask();
else if(t.closest("#ex"))exp()});
let CPT=[];const _r=render;render=function(){_r();CPT=CP.slice()};
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.up){upFile(t.dataset.up,[...t.files]);t.value="";return}if(t.dataset.d!=null){S.done[t.dataset.d]=t.checked;save();render()}});
document.addEventListener("input",e=>{const t=e.target;if(t.dataset.fb)S.fbt[t.dataset.fb]=t.value;if(t.id=="cq")S.cqv=t.value;if(t.dataset.b=="contact"){const f=document.querySelector(".br .bf");if(f)f.textContent=t.value||(S.req.brochure&&S.req.brochure.contact)||""}if(t.dataset.b){S.brief[t.dataset.b]=t.value;save();const b=document.querySelector(".pg i");if(b)b.style.width=fillPct()+"%"}});
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&(S.fs||S.menu)){S.fs=false;S.menu=false;render();return}if(S.tab=="deck"&&S.deck&&S.deck.slides&&!/INPUT|TEXTAREA/.test(e.target.tagName)){const d=e.key=="ArrowRight"?1:e.key=="ArrowLeft"?-1:0;if(d){S.i=Math.max(0,Math.min(S.deck.slides.length-1,S.i+d));render()}}});
async function exp(){const d=await claude.use("downloads");if(!d)return;let m=`# ${S.brief.name||"Pazarlama Planı"}\n\n`;
if(S.brand){const b=S.brand,bi=b.bigIdea||{};m+="## Marka Kiti\n\n- Öz: "+b.essence+"\n- Slogan: "+b.tagline+"\n- Manifesto: "+b.manifesto+"\n- Büyük fikir: "+bi.name+" - "+bi.idea+"\n- Renkler: "+(b.palette||[]).map(c=>c.name+" "+c.hex).join(", ")+"\n\n"}
if(S.deck&&S.deck.slides)m+="## Yönetim Sunumu\n\n"+S.deck.slides.map((s,k)=>`### ${k+1}. ${s.title}\n${s.subtitle?s.subtitle+"\n":""}${(s.bullets||[]).map(b=>"- "+b).join("\n")}\n${(s.kpis||[]).map(x=>`- **${x.value}** ${x.label}`).join("\n")}\n*Not: ${s.note||""}*\n`).join("\n");
if(S.plan&&S.plan.tasks)m+="\n## Aksiyon Planı\n\n"+S.plan.tasks.map((t,k)=>`- [${S.done[k]?"x":" "}] (${t.phase}) ${t.title} | ${t.owner} | ${t.kpi} | ${t.priority}`).join("\n");
if(S.mk)m+="\n\n## İçerikler\n\nSloganlar:\n"+(S.mk.slogans||[]).map(s=>"- "+s).join("\n")+"\n\n"+(S.mk.posts||[]).map(p=>`**${p.format}** ${p.hook}\n${p.caption}\n${p.cta}\n`).join("\n")+"\n"+(S.mk.ads||[]).map(a=>`**${a.headline}**\n${a.text}\n`).join("\n")+(S.mk.email?`\n**E-posta: ${S.mk.email.subject}**\n${S.mk.email.body}`:"");
try{await d.save({filename:"pazarlama-muduum-plani.md",data:m})}catch(e){}}
render();
